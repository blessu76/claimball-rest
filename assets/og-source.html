<!doctype html><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Nunito:wght@700;800&display=swap');
html,body{margin:0}
.og{width:1200px;height:630px;position:relative;overflow:hidden;background-color:#FBF8EE;background-image:linear-gradient(#D3E2EA 1px,transparent 1px),linear-gradient(90deg,#D3E2EA 1px,transparent 1px);background-size:28px 28px;font-family:'Nunito',sans-serif;color:#1B2540}
h1{position:absolute;left:70px;top:130px;margin:0;font:400 170px/0.95 'Caveat Brush',cursive}h1 span{color:#2B5FD9}
p{position:absolute;left:76px;top:360px;margin:0;font-weight:800;font-size:40px;width:700px;font-size:38px;line-height:1.3;color:#4B5572}
.pill{position:absolute;left:76px;top:470px;padding:10px 26px;border:3px dashed #1B2540;border-radius:16px;background:#fff;font-weight:800;font-size:30px}
.grid{position:absolute;left:800px;top:70px;width:300px;display:grid;grid-template-columns:repeat(6,1fr);border:6px solid #1B2540;background:#fff;box-shadow:12px 14px 0 #1B2540;transform:rotate(3deg)}
.grid i{display:block;aspect-ratio:1;border:1px solid #BFD0DA}.b{background:#2B5FD9}.o{background:#FFA726}
</style><div class="og"><h1>Claim<span>ball</span></h1><p>Win the notebook, one tile at a time.</p><div class="pill">Coming soon to iOS and Android</div>
<div class="grid" id="g"></div></div>
<script>var B=["...b..","bb..o.",".bbb..","b..bb.",".b.b..","o..o..",".o.oo.","oo..b.",".o.o..","..o..."],h="";B.forEach(function(r){r.split("").forEach(function(c){h+='<i class="'+(c=="b"?"b":c=="o"?"o":"")+'"></i>'})});document.getElementById("g").innerHTML=h;</script>
